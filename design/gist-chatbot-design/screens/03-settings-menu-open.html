<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정 메뉴 — 열린 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#121827;background:#f9fafb}
a{color:#ce4333}a:hover{color:#b83a2b}
.dev-link:hover{background:#f3f4f6;color:#121827 !important}
.icon-btn:hover{background:#f3f4f6}
a:focus-visible,button:focus-visible{outline:2px solid #ce4333;outline-offset:2px}
</style>
</helmet>
<div style="width: 360px; height: 400px; box-sizing: border-box; background: #f9fafb; border-right: 1px solid #e6e7eb; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 24px 12px 14px">

<div style="padding: 0 4px 6px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.02em; color: #6c7281">설정을 눌렀을 때 (관리자 계정)</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div role="menu" style="width: 248px; box-sizing: border-box; padding: 6px; background: #ffffff; border: 1px solid #e6e7eb; border-radius: 16px; box-shadow: 0 12px 32px rgba(18,24,39,0.12), 0 1px 3px rgba(18,24,39,0.06); display: flex; flex-direction: column; gap: 2px">
<a href="#dashboard" class="dev-link" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #384151; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"></path></svg><span style="flex-grow: 1">대시보드</span><span style="padding: 1px 7px; border-radius: 999px; background: #fcf3f3; font-size: 11px; line-height: 16px; font-weight: 600; color: #b83a2b">관리자</span></a>
<a href="#manage" class="dev-link" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #384151; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg><span style="flex-grow: 1">문서 관리</span><span style="padding: 1px 7px; border-radius: 999px; background: #fcf3f3; font-size: 11px; line-height: 16px; font-weight: 600; color: #b83a2b">관리자</span></a>
<div style="height: 1px; margin: 4px 6px; background: #e6e7eb"></div>
<a href="#docs" class="dev-link" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #384151; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"></path><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"></path></svg>문서</a>
<a href="#keys" class="dev-link" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #384151; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M17 6l3 3M15 8l2 2"></path></svg>키 발급</a>

<div style="border-top: 1px solid #e6e7eb; padding-top: 10px">

</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 6px 2px; border-top: 1px solid #e6e7eb">
<div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #fcf3f3; border: 1px solid #f7dcd8; color: #b83a2b; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">준</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #121827">준성</span>
<span style="font-size: 12px; line-height: 16px; color: #6c7281">관리자</span>
</div>
<a href="#logout" class="icon-btn" aria-label="로그아웃" style="width: 36px; height: 36px; border-radius: 10px; color: #384151; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l5 4-5 4M20 12H9"></path></svg></a>
</div>
</div>
</div>
</x-dc>
